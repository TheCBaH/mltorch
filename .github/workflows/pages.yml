name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - uses: ./.github/workflows/actions/devcontainer
      id: devcontainer
    - name: setup
      run: echo 'EXEC=${{ steps.devcontainer.outputs.exec }}' >> $GITHUB_ENV
    - name: build site
      run: ${{ env.EXEC }} make webapp.build
    - name: configure Pages
      id: pages
      uses: actions/configure-pages@v6
    - name: upload artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: webapp-dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
    - name: deploy
      id: deployment
      uses: actions/deploy-pages@v4
