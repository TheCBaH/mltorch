name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: git cache
      uses: actions/cache@v6
      with:
        path: .git
        key: git-${{ runner.os }}-${{ github.ref_name }}
        restore-keys: |
          git-${{ runner.os }}-
    - name: checkout
      uses: actions/checkout@v7
      with:
        # Top-level only: this checks out the vendored libraries' own source but
        # NOT their nested submodules (opickle pulls in cpython purely as test
        # data — we never run its tests). pytorch's third_party is needed by the
        # aten build, so it is initialised recursively on its own below.
        submodules: true
    - name: pytorch submodules
      run: |
        git -C modules/pytorch submodule update --init --recursive --depth 1
    - name: devcontainer
      uses: ./.github/workflows/actions/devcontainer
      id: devcontainer
    - name: setup
      run: |
        echo 'EXEC=${{ steps.devcontainer.outputs.exec }}' >> $GITHUB_ENV
    - name: cache keys
      id: cache_keys
      run: |
        echo "pytorch=$(git rev-parse HEAD:modules/pytorch)" >> $GITHUB_OUTPUT
        echo "month=$(date +'%Y-%m')" >> $GITHUB_OUTPUT
        make -s pt2.vars >> $GITHUB_OUTPUT
    # .ccache is at the repo root, which the devcontainer bind-mounts, so the
    # host dir actions/cache manages and the container's CCACHE_DIR are the same
    # files. Keyed by month + pinned PyTorch commit + hash of the build scripts
    # (they decide which C++ sources compile and how); restore-keys warm-start
    # from the closest prior cache.
    - name: ccache cache
      uses: actions/cache@v6
      with:
        path: .ccache
        key: ccache-${{ steps.cache_keys.outputs.month }}-${{ steps.cache_keys.outputs.pytorch }}-${{ hashFiles('lib/aten/**/*.cpp', 'lib/aten/**/*.h', 'lib/aten/build_archive.sh', 'lib/aten/gen_macros.sh', 'lib/aten/run_codegen.sh') }}
        restore-keys: |
          ccache-${{ steps.cache_keys.outputs.month }}-${{ steps.cache_keys.outputs.pytorch }}-
          ccache-${{ steps.cache_keys.outputs.month }}-
    - name: build
      run: |
        mkdir -p .ccache
        ${{ env.EXEC }} sh -ceu 'CCACHE_DIR="$(pwd)/.ccache" CCACHE_MAXSIZE=1G make build BUILD_OPTIONS="--display short"'
    - name: ccache stats
      run: |
        ${{ env.EXEC }} sh -ceu 'CCACHE_DIR="$(pwd)/.ccache" ccache -s'
    - name: test
      run: |
        ${{ env.EXEC }} make runtest
    # Model release .zips (12 MB-1.1 GB each; ~5.3 GB total across all 22
    # models exercised by `make inference`) are fetched from the
    # pytorch.models.pt2 GitHub release (a public asset, so curl needs no
    # token) into data/pt2/<model>/. One cache entry covers every zip
    # downloaded so far this release (glob path), keyed by release tag + a
    # hash of the model list, so adding/removing a model creates a fresh
    # cache entry instead of an immutable cache silently going stale; the
    # restore-key drops the hash to still warm-start from the closest prior
    # cache. The path/key come from `make pt2.vars` so they track the
    # Makefile. data/pt2/ is gitignored; the host dir is bind-mounted into the
    # devcontainer, so the gated load test and inference step see it.
    - name: pt2 models cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.cache_keys.outputs.pt2_zip_glob }}
        key: ${{ steps.cache_keys.outputs.pt2_cache_key }}
        restore-keys: |
          ${{ steps.cache_keys.outputs.pt2_cache_restore_key }}
    - name: pt2 cram models download
      run: |
        make pt2.download-cram
    - name: pt2 load test
      run: |
        ${{ env.EXEC }} make pt2.runtest
    # The JS half of the same claim -- open a real .pt2, lower it and run
    # inference under node, diffed against native -- is js.yml's `jsoo pt2
    # inference test`. It could run here for free, since this job has already
    # fetched mobilenet_v3_small, but a JS regression would then redden `build`
    # while the workflow named `javascript` stayed green; and node multiplies
    # the native cost ~4.9x, so it was 1m31s of the longest job on the board
    # while the jsoo job sat idle after 21s of testing.
    #
    # Fast per-push latency signal for the smallest model (resnet18), so
    # regressions show up without waiting on the full 22-model "inference"
    # sweep below (20+ minutes). Reuses the resnet18 data already fetched by
    # "pt2 cram models download" and the binary just built by "pt2 load test".
    - name: bench inference (smallest model)
      run: |
        ${{ env.EXEC }} make benchmark.inference
    # Every inference.<model> is independent, so this is safe to parallelize
    # across the runner's actual core count (queried inside the devcontainer,
    # in case it ever differs from the host's). Note: at the high end this is
    # memory-, not CPU-, bound (efficientnet_b7 alone peaks ~5.6 GB RSS) - if
    # a future runner's core count ever outscales its RAM (GH's standard
    # tiers scale both together, ~4 GB/core), revisit with an explicit cap.
    - name: inference
      run: |
        ${{ env.EXEC }} sh -ceu 'make -j"$(nproc)" inference'
    - name: format
      run: |
        ${{ env.EXEC }} make format
    - name: verify pristine
      run: |
        ${{ env.EXEC }} bash -c '
          git_status=$(git status --porcelain)
          if [ -n "$git_status" ]; then
            echo "Git directory is not pristine. Modified or created files:"
            echo "$git_status"
            exit 1
          fi
        '
    # Last two steps: both build under a different dune profile/env than
    # everything above (memtrace is the same build, landmarks rebuilds
    # lib/native under --profile landmarks — see lib/native/dune), so they
    # run after "verify pristine" to keep that extra rebuild churn from
    # affecting any earlier step's timing/artifacts. See Makefile's
    # profile.* targets and .ai/pt2_inference_perf.md's landmarks section.
    - name: profile native conv2d (memtrace)
      run: |
        ${{ env.EXEC }} make profile.memtrace
    # landmarks needs PROFILE_FIXTURE overridden to a tiny synthetic conv:
    # *active* tracking (not just idle instrumentation) times every single
    # instrumented call, and the full resnet18 fixture (~1.83B inner calls)
    # takes minutes, not seconds, under that (measured while developing this
    # step). The callgraph prints to stderr.
    - name: profile native conv2d (landmarks)
      run: |
        ${{ env.EXEC }} make profile.landmarks PROFILE_FIXTURE=test/data/profile/conv2d_small.json
    - name: native whole-graph inference verification
      run: |
        ${{ env.EXEC }} make native-infer-verify
    # native-infer-verify above checks the UNTRANSFORMED interpreter path
    # against ATen; the transform pipeline (permute simplification, folding,
    # ...) is otherwise only checked structurally, by the golden text in
    # native_transform_cram.t/native_transform_fold_cram.t. This runs both the
    # structural and --fold pipelines and numerically compares each against
    # the untransformed graph, so a transformation that silently changes
    # output values (rather than node structure) is still caught. See
    # .ai/native_transform_design.md §3.
    - name: native transform pipeline verification
      run: |
        ${{ env.EXEC }} make native-transform-verify
