name: timm fixtures

on:
  workflow_dispatch:
    inputs:
      producer_run:
        description: Producer release-validation Actions run
        type: string
        required: true
        default: '38163037026'

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - uses: TheCBaH/devcontainer-action/devcontainer@v1
        id: devcontainer
        with:
          cli-version: '0.88.0'
      - name: Acquire the producer dry run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ inputs.producer_run }}" -R TheCBaH/devcontainer.pytorch-image-models -n release-validation -D data/timm-publication
      - name: Verify independent inputs and replay both acquisition paths
        run: |
          ${{ steps.devcontainer.outputs.exec }} sh -ceu '
            opam exec -- dune runtest test/timm_fixture
            opam exec -- dune build bin/timm_fixture_tool.exe
            export TIMM_MANIFEST="$(pwd)/data/timm-publication/release/manifest-v2.json"
            export TIMM_SOURCE_DIR="$(pwd)/data/timm-publication/release"
            export TIMM_CACHE="$(pwd)/data/timm-cache"
            export MODELS_DIR="$(pwd)/modules/devcontainer.pytorch-image-models/models"
            export HF_HUB_CACHE="$(pwd)/data/timm-hub"
            export TIMM_TRANSFER_LOG="$(pwd)/data/timm-transfers.tsv"
            _build/default/bin/timm_fixture_tool.exe verify-inputs-all
            _build/default/bin/timm_fixture_tool.exe replay mobilenetv2_050
            _build/default/bin/timm_fixture_tool.exe replay-images mobilenetv2_050
            HF_HUB_OFFLINE=1 TIMM_OFFLINE=1 _build/default/bin/timm_fixture_tool.exe replay-images mobilenetv2_050
          '
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: timm-acquisition-${{ runner.arch }}
          path: data/timm-transfers.tsv
