name: OCaml Images

on:
  push:
    branches:
      - '**'

jobs:
  devcontainer:
    strategy:
      fail-fast: false
      matrix:
        # Native builds: the action tags each image with its architecture.
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    permissions:
      packages: write
    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: image
      uses: TheCBaH/devcontainer-action/devcontainer@v1
      with:
        password: ${{ secrets.GITHUB_TOKEN }}
        cli-version: '0.88.0'
