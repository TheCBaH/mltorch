name: javascript

on:
  push:
  pull_request:
  workflow_dispatch:

# Four independent jobs so the backends verify in parallel rather than in
# series behind each other, and so a melange failure names melange in the job
# list instead of being buried in a combined log.
#
# The three jobs have DIFFERENT scopes, and that asymmetry is deliberate rather
# than an oversight:
#
#   jsoo    reads and runs real PT2 models, so it needs pytorch_types, which is
#           generated from the schema.yaml inside the modules/pytorch submodule.
#           It therefore checks submodules out. Still no ccache and no model
#           downloads -- it builds no C++ and its tier-1 fixture is committed.
#   melange reaches only walk_core + core + vendored fmt/jsont. It touches
#           nothing PyTorch, so it keeps the submodule-free path and asserts it.
#   browser drives the real pinned Model Explorer element under Chromium. It
#           fails for its own reasons -- an npm lockfile, a downloaded browser,
#           a renderer version -- so it is its own job for the same attribution
#           reason as the other two. It also runs the WebAssembly backend in the
#           page (make wasm.browser.runtest), since it already has the browser.
#   wasm    the WebAssembly backend under node: its fixtures, the direct and
#           C-compiled routes over every CI model, and the module generated by
#           the JavaScript build of the compiler. Its own job so a Wasm
#           regression is not read as a JS one, and because it needs a wasm32 C
#           library the other jobs do not use (installed in the image).
#
# All three reuse the devcontainer image, which build.yml has usually already
# warmed in ghcr.
#
# `make jsoo.pt2.run` (tier 3) is deliberately NOT here: ~7.5 minutes to
# re-check rankings that have not moved since the release was built, when
# jsoo.pt2.runtest already covers backend divergence in ~45s. See
# .ai/js_backends_design.md.

jobs:
  jsoo:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v7
      with:
        # Top level only, non-recursive. This job needs modules/pytorch for
        # schema.yaml (pytorch_types), modules/devcontainer.pytorch-image-models for the
        # committed model.json fixture, and both vendored/ libraries. It does
        # NOT need pytorch's third_party -- that is for the C++ archive, which
        # nothing here builds.
        submodules: true
    - name: devcontainer
      uses: TheCBaH/devcontainer-action/devcontainer@v1
      id: devcontainer
      with:
        cli-version: '0.88.0'
    - name: setup
      run: |
        echo 'EXEC=${{ steps.devcontainer.outputs.exec }}' >> $GITHUB_ENV
    - name: jsoo differential test
      run: |
        ${{ env.EXEC }} make jsoo.runtest
    # A third distinct question, same reason the two below are their own
    # steps: does each backend match its OWN committed golden for the Expr
    # evaluation-order oracle's cases -- unspecified-order sites the plan
    # deliberately allows backends to disagree on, so this is a per-backend
    # diff, not a cross-backend one like jsoo.runtest above.
    - name: expr evaluation-order oracle
      run: |
        ${{ env.EXEC }} make expr_order.runtest
    # A separate step from the differential probe above, so a failure names the
    # layer: the probe answers "do the backends agree", these answer "is the
    # answer right".
    - name: jsoo inline tests
      run: |
        ${{ env.EXEC }} make jsoo.inline-runtest
    # The Loop IR's generated JavaScript, run under node, against what the Loop
    # interpreter says the same programs do: "is the emitted code right", which
    # neither the differential probe nor the inline tests ask.
    - name: loop ir generated code
      run: |
        ${{ env.EXEC }} make loop.js.runtest
    # Tier 2, the only step here that needs downloaded weights. It lives in this
    # workflow rather than in build.yml -- which already has the models -- for
    # two reasons. Attribution: left there it was the one JS verdict that could
    # go red while `javascript` stayed green, the failure mode the jsoo/melange
    # job split exists to prevent. Wall clock: node multiplies the native cost
    # ~4.9x, making this the most expensive JS step, and it was 1m31s on a 13+
    # minute serial job while this one finished its testing in 21s and idled.
    #
    # One model (~99MB), not PT2_MODELS_CRAM, under its OWN cache key -- see the
    # jsoo.pt2.vars comment in the Makefile for why sharing build.yml's key
    # would silently poison it.
    - name: cache keys
      id: cache_keys
      run: |
        make -s jsoo.pt2.vars >> $GITHUB_OUTPUT
        make -s loop_js.pt2.vars >> $GITHUB_OUTPUT
    - name: pt2 model cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.cache_keys.outputs.jsoo_pt2_zip_glob }}
        key: ${{ steps.cache_keys.outputs.jsoo_pt2_cache_key }}
        restore-keys: |
          ${{ steps.cache_keys.outputs.jsoo_pt2_cache_restore_key }}
    - name: pt2 model download
      run: |
        make jsoo.pt2.download
    # A second model (fastvit_sa12, ~96MB), its own key for the same reason
    # jsoo_pt2 has one -- see loop_js.pt2.vars' own comment in the Makefile.
    # Needed by the two fast-path steps below.
    - name: loop_js pt2 model cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.cache_keys.outputs.loop_js_pt2_zip_glob }}
        key: ${{ steps.cache_keys.outputs.loop_js_pt2_cache_key }}
        restore-keys: |
          ${{ steps.cache_keys.outputs.loop_js_pt2_cache_restore_key }}
    - name: loop_js pt2 model download
      run: |
        make loop_js.pt2.download
    - name: jsoo pt2 inference test
      run: |
        ${{ env.EXEC }} make jsoo.pt2.runtest
    # Every node of the same already-cached model through its own generated-JS
    # kernel ~100s, the same order as
    # the step above, and no new download since it reuses JS_PT2_MODEL's own
    # cache entry. Also the jsoo/node side of the tensor arena check (--arena,
    # see the Makefile target's own comment and
    # the tensor arena design in .ai/) -- native_graph's own build.yml
    # step is native-only.
    - name: jsoo pt2 node coverage
      run: |
        ${{ env.EXEC }} make loop_js.node.pt2.runtest
    # Same model, --direct: the raw, untransformed graph through the compiled
    # kernels instead of canonical's folded one. Also ~100s (measured), so
    # cheap enough for every push; the jsoo/node counterpart of build.yml's
    # "native whole-graph inference verification (direct graph)".
    - name: jsoo pt2 node coverage (direct graph)
      run: |
        ${{ env.EXEC }} make loop_js.node.pt2.direct.runtest
    # The whole-model bundle (one JS entry call), bitwise against per-node.
    - name: jsoo pt2 whole-model bundle
      run: |
        ${{ env.EXEC }} make loop_js.bundle.pt2.runtest
    # fastvit_sa12, WITHOUT --shadow: Loop_node_executor's own default
    # (shadow:false) trusts each compiled kernel directly instead of also
    # running the reference interpreter, verified only by --strict's ranking
    # check. ~26s -- removing the shadow double-run is what makes this model
    # affordable in CI at all (WITH it, canonical alone exceeded 300s; see
    # the whole-model JS design in .ai/) -- and the only CI coverage of
    # Region-authored ops (RmsNorm/LayerNorm/Softmax/Sdpa) under generated JS:
    # mobilenetv2_050 above has none.
    - name: jsoo pt2 node coverage (fastvit, fast path)
      run: |
        ${{ env.EXEC }} make loop_js.node.pt2.fast.runtest
    - name: jsoo pt2 node coverage (fastvit, fast path, direct graph)
      run: |
        ${{ env.EXEC }} make loop_js.node.pt2.fast.direct.runtest

  # The WebAssembly backend (see the Wasm backend design doc in .ai/). Node runs
  # everything here; the browser half is in the `browser` job below. WASI_SYSROOT
  # is /usr: the image installs wasi-libc and libclang-rt-dev-wasm32 with apt.
  wasm:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: devcontainer
      uses: TheCBaH/devcontainer-action/devcontainer@v1
      id: devcontainer
      with:
        cli-version: '0.88.0'
    - name: setup
      run: |
        echo 'EXEC=${{ steps.devcontainer.outputs.exec }}' >> $GITHUB_ENV
    # The op table and structural fixtures under node, every Loop_check fixture
    # and the op sweep through the emitted module, the C-compiled route, and the
    # byte-for-byte agreement of native and 32-bit-int generation.
    - name: wasm fixtures and differential
      run: |
        ${{ env.EXEC }} make WASI_SYSROOT=/usr wasm.runtest
    - name: wasm generated in JavaScript
      run: |
        ${{ env.EXEC }} make wasm.jsoo.runtest
    # A passing suite is not evidence that it can fail: each deliberate defect in
    # the lowering must turn the differential red.
    - name: wasm mutation check
      run: |
        ${{ env.EXEC }} env WASI_SYSROOT=/usr scripts/wasm-mutation-check.sh
    - name: cache keys
      id: cache_keys
      run: |
        make -s pt2.vars >> $GITHUB_OUTPUT
        make -s jsoo.pt2.vars >> $GITHUB_OUTPUT
    # The same models as build.yml's whole-model C backend step, under the same
    # key, so a warm cache from that workflow serves this one.
    - name: pt2 models cache
      uses: actions/cache@v6
      with:
        path: ${{ steps.cache_keys.outputs.pt2_zip_glob }}
        key: ${{ steps.cache_keys.outputs.pt2_cache_key }}
        restore-keys: |
          ${{ steps.cache_keys.outputs.pt2_cache_restore_key }}
    - name: pt2 cram models download
      run: |
        make pt2.download-cram
        make pt2.download PT2_MODEL=csatv2
    # Every CI model through model_run under node, every output bitwise equal to
    # the per-node reference, workspace poisoned: the direct emitter, then the
    # C backend's unit compiled to Wasm.
    - name: whole-model wasm backend (all downloaded models)
      run: |
        ${{ env.EXEC }} make WASI_SYSROOT=/usr wasm.pt2.runtest
    - name: whole-model wasm backend, C compiled to wasm (all downloaded models)
      run: |
        ${{ env.EXEC }} make WASI_SYSROOT=/usr wasm.c.pt2.runtest
    - name: whole-model wasm SIMD backend (all downloaded models)
      run: |
        ${{ env.EXEC }} make WASI_SYSROOT=/usr wasm.simd.pt2.runtest
    # The model generated by the JavaScript build of the compiler, byte-identical
    # to the native compiler's.
    - name: wasm model generated in javascript
      run: |
        ${{ env.EXEC }} make wasm.jsoo.pt2.runtest

  # The BROWSER gate. A third job for the same reason there are two: it fails
  # for its own reasons -- an Angular renderer build, an npm lockfile, a
  # downloaded Chromium -- and burying that in either of the others would make a
  # browser regression read as an OCaml one.
  #
  # It needs the modules/devcontainer.pytorch-image-models submodule for resnet18's committed
  # model.json: the gate renders the session `native_graph visualize` actually
  # produces from it, which is the only check anywhere that our export is one
  # the real element accepts rather than one our own validator accepts.
  browser:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v7
      with:
        submodules: true
    - name: devcontainer
      uses: TheCBaH/devcontainer-action/devcontainer@v1
      id: devcontainer
      with:
        cli-version: '0.88.0'
    - name: setup
      run: |
        echo 'EXEC=${{ steps.devcontainer.outputs.exec }}' >> $GITHUB_ENV
    # The visualizer is BUILT from the submodule rather than installed from npm
    # (see the `visualizer.build` block in the Makefile), and `submodules: true`
    # above is top-level only by the policy build.yml documents -- so the nested
    # checkout is named here, and it has to precede the cache step because it is
    # what makes the key computable.
    - name: visualizer submodule
      run: |
        git -C vendored/ocaml-model-explorer submodule update --init --depth 1 model-explorer
        echo "VISUALIZER_REF=$(git -C vendored/ocaml-model-explorer rev-parse HEAD:model-explorer)" >> $GITHUB_ENV
    # Cache the BUILT BUNDLE, not node_modules: on a hit this skips a
    # 1191-package npm ci and two Angular builds outright. The submodule commit
    # and the patch are jointly what determine the output, so both are in the
    # key -- a bump or a re-derived patch gets a fresh entry rather than
    # silently reusing a bundle built from different source.
    - name: visualizer bundle cache
      uses: actions/cache@v6
      with:
        path: vendored/ocaml-model-explorer/model-explorer/src/ui/custom_element_npm/dist
        key: visualizer-${{ env.VISUALIZER_REF }}-${{ hashFiles('patches/model-explorer-custom-element-worker.patch') }}
    - name: node modules cache
      uses: actions/cache@v6
      with:
        path: web/node_modules
        key: web-npm-${{ hashFiles('web/package-lock.json') }}
    - name: playwright browser cache
      uses: actions/cache@v6
      with:
        # The browser is used from inside the devcontainer, so it must live in
        # the workspace rather than the runner user's home directory.
        path: web/.playwright-browsers
        key: playwright-${{ hashFiles('web/package-lock.json') }}
    - name: build the renderer and install chromium
      run: |
        ${{ env.EXEC }} make spike.setup
    # Two specs, and they answer different questions: the 0A spike asks what the
    # renderer does, the Stage 1 gate asks whether what we emit is something it
    # accepts. See .ai/model_explorer_design.md §8.
    - name: browser gate
      run: |
        ${{ env.EXEC }} make spike.runtest
    - name: webapp unit and assembled-site gates
      run: |
        ${{ env.EXEC }} make webapp.runtest webapp.bridge-runtest webapp.browser-runtest
    # The WebAssembly backend in the page: fixtures generated by the JavaScript
    # build of the compiler and compiled through the promise API, a real model
    # exported by the native compiler run twice on one instance, and the CSP
    # limit. Reuses the chromium installed above.
    - name: wasm in a real browser
      run: |
        ${{ env.EXEC }} make wasm.browser.runtest

  melange:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v7
    - name: devcontainer
      uses: TheCBaH/devcontainer-action/devcontainer@v1
      id: devcontainer
      with:
        post-create: 'false'
        cli-version: '0.88.0'
    - name: setup
      run: |
        echo 'EXEC=${{ steps.devcontainer.outputs.exec }}' >> $GITHUB_ENV
    # Named, never --recursive (see "Submodules: name them" below). core (and
    # its melange mirror, core_mel) depends on err_trace -- Core.Pretty prints
    # Err.Error.t -- so melange needs this one submodule despite otherwise
    # staying submodule-free.
    - name: init the err_trace submodule
      run: |
        git submodule update --init vendored/err_trace
    # AFTER the devcontainer step, not before: before it this passes trivially
    # and proves nothing. Excludes vendored/err_trace, initialized deliberately
    # above; checks every other gitlink, so a new submodule is covered without
    # anyone remembering to update this.
    #
    # This is now the melange job's alone, and it does more than assert a
    # checkout flag: melange's reach is meant to stop at walk_core + core, and
    # everything past that line goes through pytorch_types, which needs a
    # submodule. If this ever goes red, the melange closure has grown -- most
    # likely because a probe section drifted to the wrong library.
    - name: assert no other submodule was initialized
      run: |
        if git submodule status | grep -v vendored/err_trace | grep -qv '^-'; then
          echo "A submodule other than vendored/err_trace was initialized." >&2
          git submodule status >&2
          exit 1
        fi
        echo "no other submodules initialized"
    # The scaffold first, so a failure says which layer broke: if this passes
    # and the next step fails, the vendored libraries are fine and the problem
    # is the jsont patch or what sits on it.
    - name: melange scaffold builds
      run: |
        ${{ env.EXEC }} make melange.build.scaffold
    - name: melange differential test
      run: |
        ${{ env.EXEC }} make melange.runtest
