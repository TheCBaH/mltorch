<meta charset="utf-8">
<title>Phase 4 selected-node event contract</title>
<style>
  html, body { margin: 0; height: 100%; }

  /* The shape web/app/app.css installs, verbatim in structure -- the same
     stable-slot stacking `lifecycle.html` pins, because a comparison candidate
     is the same kind of candidate and is replaced the same way. A slot hides
     with `visibility`, never `display:none`: a display-none element stops
     laying out and never emits `modelGraphProcessed`. */
  #mount { position: relative; width: 1000px; height: 700px; }
  .slot { position: absolute; inset: 0; visibility: hidden; pointer-events: none; }
  .slot--current { visibility: visible; pointer-events: auto; }
  model-explorer-visualizer { display: block; width: 100%; height: 100%; }
</style>

<div id="mount"></div>

<script src="vendor/main_browser.js"></script>
<script>
  // AFTER the bundle, and as MUTATIONS of the object it installed -- Stage 0A
  // found that setting this before the bundle does nothing. index.html keeps
  // the probe that proves it.
  window.modelExplorer.assetFilesBaseUrl = 'vendor/static_files';
  window.modelExplorer.workerScriptPath = 'vendor/worker.js';
</script>

<script src="flow.js"></script>
